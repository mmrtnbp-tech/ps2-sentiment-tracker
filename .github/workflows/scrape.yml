name: Daily PS2 Sentiment Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # Runs every day at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USER: ${{ secrets.RA_USER }}
        run: python scraper.py

      - name: Commit and Push CSV Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ps2_sentiment_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: daily sentiment data [$(date -u +'%Y-%m-%d')]" && git push)
